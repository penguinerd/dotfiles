# Organization
source = ~/.config/hypr/hyprbinds.conf
source = ~/.config/hypr/hyprstart.conf

# Monitors
monitor=,preferred,auto,auto

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Permissions

# Look/Feel
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 6
    col.active_border = rgb(c6a0f6) rgb(ed8796) rgb(ee99a0) rgb(f5a97f) rgb(eed49f) rgb(a6da95) rgb(8bd5ca) rgb(91d7e3) rgb(8aadf4) rgb(f0c6c6) 6deg
    col.inactive_border = rgb(EC915A) rgb(3577D6) 45deg
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 15
        render_power = 1
        color = rgba(2a7a9aee)
    }

    blur {
        enabled = true
        size = 10
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = spaces, 0.45, -0.5, 0.265, 1.35 
    bezier = resize, 0.5, -0.9, 0.43, 1.23
    bezier = inmove, 0.07, 0.9, 0.3, 1.26

    animation = windows, 1, 3, inmove, slide
    animation = windowsOut, 1, 100, inmove, slide
    animation = border, 1, 12, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, spaces, slidevert
}

dwindle {
# pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
}

# Input
input {
    kb_layout = us
        kb_variant =
        kb_model =
        kb_options =
        kb_rules =

        accel_profile = flat
        follow_mouse = 1
        mouse_refocus = 0
        force_no_accel = true
# allow_mouse_while_typing = true
        follow_mouse = 1

        sensitivity = 0 

        touchpad {
            natural_scroll = false
        }
}

device {
    name = epic-mouse-v1
        sensitivity = -0.5
}

# Windows, Workspaces
